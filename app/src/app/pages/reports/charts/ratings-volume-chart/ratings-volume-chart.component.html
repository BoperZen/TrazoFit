<!-- ratings-volume-chart.component.html -->
<div class="chart-wrapper">
  <h3 class="chart-title">Calificación Promedio vs Volumen de Citas</h3>
  <p class="chart-subtitle">Correlación entre reputación y demanda por profesional</p>

  <ngx-charts-bubble-chart
    [view]="view"
    [results]="data()"
    [scheme]="colorScheme"
    [xAxis]="true"
    [yAxis]="true"
    [legend]="false"
    [showXAxisLabel]="true"
    [showYAxisLabel]="true"
    xAxisLabel="Calificación promedio (0–5)"
    yAxisLabel="Total de citas atendidas"
    [xScaleMin]="xScaleMin"
    [xScaleMax]="xScaleMax"
    [yScaleMin]="yScaleMin"
    [yScaleMax]="yScaleMax"
    [minRadius]="minRadius"
    [maxRadius]="maxRadius"
    [tooltipDisabled]="false"
  />
</div>
