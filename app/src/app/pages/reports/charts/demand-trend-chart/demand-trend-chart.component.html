<!-- demand-trend-chart.component.html -->
<div class="chart-wrapper">
  <h3 class="chart-title">Evolución de la Demanda de Servicios</h3>
  <p class="chart-subtitle">Comparativa mensual por tipo de servicio — Año en curso</p>

  <ngx-charts-line-chart
    [view]="view"
    [results]="data()"
    [scheme]="colorScheme"
    [xAxis]="true"
    [yAxis]="true"
    [legend]="true"
    legendPosition="below"
    [showXAxisLabel]="true"
    [showYAxisLabel]="true"
    xAxisLabel="Mes"
    yAxisLabel="Cantidad de citas"
    [curve]="'curveMonotoneX'"
    [roundDomains]="true"
    [timeline]="false"
    [tooltipDisabled]="false"
  />
</div>
